name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opensuitemcp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run lint
        run: pnpm lint
      - name: Run unit tests
        run: find lib -name '*.test.ts' -print0 | xargs -0 pnpm exec tsx --test
      - name: Build
        env:
          AUTH_SECRET: ci-auth-secret
          ENCRYPTION_KEY: ci-encryption-key-32-bytes-long!!
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/opensuitemcp
          REDIS_URL: redis://localhost:6379
          NEXTAUTH_URL: http://localhost:3000
        run: pnpm build
