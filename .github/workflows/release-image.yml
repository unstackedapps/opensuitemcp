name: Release image

# Publishes ghcr.io/unstackedapps/opensuitemcp for each release tag. Installs
# made with deploy/install.sh pull these images, and `osmcp update` moves an
# install to one.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build again, e.g. v5.10.0
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    # Tags land on the private wip repo too; only the public repo publishes.
    if: github.repository == 'unstackedapps/opensuitemcp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/unstackedapps/opensuitemcp
          # 5.10.0, 5.10 and latest; a prerelease such as 5.10.0-rc.1 gets only its own tag.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
