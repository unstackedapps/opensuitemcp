services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: opensuitemcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: opensuitemcp
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensuitemcp"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 48mb --maxmemory-policy allkeys-lru
    volumes:
      - /data/redis:/data
    mem_limit: 64m

  searxng:
    image: ${SEARXNG_IMAGE}
    restart: unless-stopped
    environment:
      SEARXNG_METHOD: GET
      SEARXNG_BIND_ADDRESS: 0.0.0.0
    mem_limit: 256m

  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    env_file:
      - /opt/opensuitemcp/app.env
    mem_limit: 768m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - /opt/opensuitemcp/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/opensuitemcp/basic-auth.caddy:/etc/caddy/basic-auth.caddy:ro
      - /data/caddy:/data
      - /data/caddy-config:/config
    mem_limit: 64m
    depends_on:
      - app
